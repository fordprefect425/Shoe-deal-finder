name: Daily Shoe Price Check

on:
  schedule:
    # Run at 03:30 UTC which is 09:00 IST
    - cron: '30 3 * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  run-check:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Create Config File from Secret
        run: |
          mkdir -p data
          # Use the CONFIG_JSON secret from GitHub
          echo '${{ secrets.CONFIG_JSON }}' > data/config.json

      - name: Run Price Check
        run: |
          python run_once.py
